openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Browser authentication state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/status:
    get:
      operationId: getPasswordAuthStatus
      responses:
        "200":
          description: Whether the administrator login has been created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAuthStatus" }
  /auth/login:
    post:
      operationId: passwordLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLoginInput" }
      responses:
        "200":
          description: Signed in with a rotated secure cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/setup:
    post:
      operationId: setupPasswordOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSetupInput" }
      responses:
        "200":
          description: One-time owner setup completed and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/logout:
    post:
      operationId: passwordLogout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLogoutInput" }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/account:
    get:
      operationId: getPasswordAccount
      responses:
        "200":
          description: Current administrator login settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
    patch:
      operationId: updatePasswordAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordAccountInput" }
      responses:
        "200":
          description: Account saved, other sessions revoked and current cookie rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
  /admin/access:
    get:
      operationId: getAdminAccess
      responses:
        "200":
          description: Current owner access state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Real order totals and recent orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/orders:
    get:
      operationId: listAdminOrders
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Bounded order page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Safe order details and recovery eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
  /admin/status:
    get:
      operationId: getAdminStatus
      responses:
        "200":
          description: Configuration readiness, not an upstream health probe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
  /admin/orders/{id}/recovery:
    post:
      operationId: previewTrialRecovery
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryPreviewInput" }
      responses:
        "200":
          description: Preview only; no account queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryDraft" }
  /admin/recovery/confirm:
    post:
      operationId: confirmTrialRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryConfirmation" }
      responses:
        "200":
          description: Original trial queued or preview cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryResult" }
  /auth/totp/setup:
    post:
      operationId: setupTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpSetupInput" }
      responses:
        "200":
          description: Pending authenticator secret for this session only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
  /auth/totp/enable:
    post:
      operationId: enableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200":
          description: Two-factor sign-in enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
  /auth/totp/disable:
    post:
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableInput" }
      responses:
        "200":
          description: Two-factor sign-in disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
  /admin/resellers:
    get:
      operationId: listAdminResellers
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Resellers with balances and customer counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerPage" }
    post:
      operationId: createAdminReseller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerCreateInput" }
      responses:
        "200":
          description: Reseller account created and activated by the owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/resellers/{id}:
    get:
      operationId: getAdminReseller
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One reseller with statistics and recent credit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/resellers/{id}/status:
    post:
      operationId: setAdminResellerStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerStatusInput" }
      responses:
        "200":
          description: Updated reseller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/resellers/{id}/credits:
    post:
      operationId: adjustAdminResellerCredits
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerCreditsInput" }
      responses:
        "200":
          description: Updated reseller after a manual credit adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/resellers/{id}/trial-limits:
    post:
      operationId: setAdminResellerTrialLimits
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerTrialLimitsInput" }
      responses:
        "200":
          description: Updated reseller after changing its own trial limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/subscriptions:
    get:
      operationId: listAdminSubscriptions
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: source, in: query, schema: { type: string, enum: [retail, reseller] } }
        - { name: kind, in: query, schema: { type: string, enum: [trial, paid] } }
        - { name: status, in: query, schema: { type: string, enum: [active, expired] } }
        - { name: reseller, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Delivered retail and reseller accounts with their login details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSubscriptionPage" }
    post:
      operationId: addAdminSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionAddInput" }
      responses:
        "200":
          description: Membership queued for a Telegram user without payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionAddResult" }
  /admin/subscriptions/groups:
    get:
      operationId: listAdminSubscriptionGroups
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: kind, in: query, schema: { type: string, enum: [trial, paid] } }
        - { name: reseller, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Running accounts grouped by seller, with expired ones listed separately
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSubscriptionGroups" }
  /admin/subscriptions/{source}/{id}/delete:
    post:
      operationId: deleteAdminSubscription
      parameters:
        - { name: source, in: path, required: true, schema: { type: string, enum: [retail, reseller] } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscriptionDeleteInput" }
      responses:
        "200":
          description: Subscription removed from the dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionDeleteResult" }
  /admin/logs/activity:
    get:
      operationId: listAdminActivityLog
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: source, in: query, schema: { type: string, enum: [retail, reseller] } }
        - { name: reseller, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Accounts created and extended, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityLogPage" }
  /admin/logs/credits:
    get:
      operationId: listAdminCreditLog
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: scope, in: query, schema: { type: string, enum: [usage, all] } }
        - { name: reseller, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Reseller credit movements, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreditLogPage" }
  /admin/reports:
    get:
      operationId: getAdminReports
      parameters:
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
      responses:
        "200":
          description: Monthly revenue and credit movements plus per-reseller totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReports" }
  /admin/tickets:
    get:
      operationId: listAdminTickets
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, answered, closed, all], default: open } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Support tickets with the latest message preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketPage" }
    post:
      operationId: openAdminTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketCreateInput" }
      responses:
        "200":
          description: Ticket opened by support and sent to the recipient in Telegram
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/tickets/{id}:
    get:
      operationId: getAdminTicket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One ticket with its full conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/tickets/{id}/reply:
    post:
      operationId: replyAdminTicket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyInput" }
      responses:
        "200":
          description: Ticket after the answer was stored and sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/tickets/{id}/status:
    post:
      operationId: setAdminTicketStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketStatusInput" }
      responses:
        "200":
          description: Ticket after the status change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/ratecard:
    get:
      operationId: getAdminRateCard
      responses:
        "200":
          description: Credit packs, subscription costs and trial limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRateCard" }
    post:
      operationId: updateAdminRateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateCardInput" }
      responses:
        "200":
          description: Rate card after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRateCard" }
  /admin/faq:
    get:
      operationId: getAdminFaq
      responses:
        "200":
          description: Customer FAQ shown in the Telegram bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFaq" }
    post:
      operationId: updateAdminFaq
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminFaq" }
      responses:
        "200":
          description: FAQ after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFaq" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    PasswordAuthStatus:
      type: object
      required: [configured, setupAvailable]
      properties:
        configured: { type: boolean }
        setupAvailable: { type: boolean }
    PasswordLogoutInput:
      type: object
      additionalProperties: false
      properties: {}
    PasswordLoginInput:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        code: { type: string, minLength: 6, maxLength: 8, pattern: "^[0-9]{6,8}$" }
    PasswordSetupInput:
      type: object
      required: [username, email, password, setupCode]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]*$" }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        setupCode: { type: string, minLength: 20, maxLength: 200 }
    PasswordAccount:
      type: object
      required: [username, email, totpEnabled]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        totpEnabled: { type: boolean }
    TotpSetupInput:
      type: object
      additionalProperties: false
      properties: {}
    TotpSetup:
      type: object
      required: [secret, uri, qr]
      properties:
        secret: { type: string }
        uri: { type: string }
        qr: { type: string }
    TotpCodeInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 6, maxLength: 8, pattern: "^[0-9]{6,8}$" }
    TotpDisableInput:
      type: object
      required: [currentPassword, code]
      additionalProperties: false
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        code: { type: string, minLength: 6, maxLength: 8, pattern: "^[0-9]{6,8}$" }
    AdminReseller:
      type: object
      required: [telegramId, username, status, createdAt, balance, reserved, available, customers, activeCustomers, creditsBought, lastActivity]
      properties:
        telegramId: { type: integer }
        username: { type: string }
        status: { type: string }
        createdAt: { type: integer }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        customers: { type: integer }
        activeCustomers: { type: integer }
        creditsBought: { type: integer }
        lastActivity: { type: integer }
    AdminTicket:
      type: object
      required: [id, telegramId, username, topic, topicLabel, status, channel, reseller, createdAt, updatedAt, messages, lastSender, preview]
      properties:
        id: { type: string }
        telegramId: { type: integer }
        username: { type: string }
        topic: { type: string }
        topicLabel: { type: string }
        status: { type: string, enum: [open, answered, closed] }
        channel: { type: string }
        reseller: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        messages: { type: integer }
        lastSender: { type: string }
        preview: { type: string }
    TicketCounts:
      type: object
      required: [open, answered, closed]
      properties:
        open: { type: integer }
        answered: { type: integer }
        closed: { type: integer }
    AdminTicketPage:
      type: object
      required: [items, page, pageSize, more, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminTicket" } }
        page: { type: integer }
        pageSize: { type: integer }
        more: { type: boolean }
        counts: { $ref: "#/components/schemas/TicketCounts" }
    TicketMessage:
      type: object
      required: [id, sender, body, actor, createdAt]
      properties:
        id: { type: string }
        sender: { type: string, enum: [customer, support] }
        body: { type: string }
        actor: { type: string }
        createdAt: { type: integer }
    AdminTicketDetail:
      type: object
      required: [ticket, messages]
      properties:
        ticket: { $ref: "#/components/schemas/AdminTicket" }
        messages: { type: array, items: { $ref: "#/components/schemas/TicketMessage" } }
        delivered: { type: boolean }
    TicketCreateInput:
      type: object
      required: [telegramId, topic, body]
      additionalProperties: false
      properties:
        telegramId: { type: integer, minimum: 1 }
        topic: { type: string, enum: [payment, login, playback, reseller, other] }
        body: { type: string, minLength: 1, maxLength: 2000 }
    ResellerCreateInput:
      type: object
      required: [telegramId, credits, reason, requestKey]
      additionalProperties: false
      properties:
        telegramId: { type: integer, minimum: 1 }
        username: { type: string, maxLength: 65 }
        credits: { type: integer, minimum: 0, maximum: 100000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
        requestKey: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
    TicketReplyInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    TicketStatusInput:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [open, closed] }
    AdminResellerPage:
      type: object
      required: [items, page, pageSize, more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminReseller" } }
        page: { type: integer }
        pageSize: { type: integer }
        more: { type: boolean }
    ResellerStatsWindow:
      type: object
      required: [credits_bought, credits_used, tests_created, subscriptions_created, tests_converted, conversion_rate]
      properties:
        credits_bought: { type: integer }
        credits_used: { type: integer }
        tests_created: { type: integer }
        subscriptions_created: { type: integer }
        tests_converted: { type: integer }
        conversion_rate: { type: integer }
    ResellerStats:
      type: object
      required: [this_month, all_time]
      properties:
        this_month: { $ref: "#/components/schemas/ResellerStatsWindow" }
        all_time: { $ref: "#/components/schemas/ResellerStatsWindow" }
    LedgerEntry:
      type: object
      required: [createdAt, movement, reason, reference]
      properties:
        createdAt: { type: integer }
        movement: { type: integer }
        reason: { type: string }
        reference: { type: string }
    TrialLimits:
      type: object
      description: Reseller trial allowances. -1 is unlimited, 0 is none.
      required: [daily, weekly, monthly, active]
      properties:
        daily: { type: integer }
        weekly: { type: integer }
        monthly: { type: integer }
        active: { type: integer }
    TrialLimitOverrides:
      type: object
      description: One reseller's own allowances. null follows the default for all resellers.
      required: [daily, weekly, monthly, active]
      properties:
        daily: { type: [integer, "null"] }
        weekly: { type: [integer, "null"] }
        monthly: { type: [integer, "null"] }
        active: { type: [integer, "null"] }
    ResellerTrials:
      type: object
      required: [limits, effective, default, usage]
      properties:
        limits: { $ref: "#/components/schemas/TrialLimitOverrides" }
        effective: { $ref: "#/components/schemas/TrialLimits" }
        default: { $ref: "#/components/schemas/TrialLimits" }
        usage: { $ref: "#/components/schemas/TrialLimits" }
    ResellerTrialLimitsInput:
      type: object
      required: [daily, weekly, monthly, active, reason]
      additionalProperties: false
      properties:
        daily: { type: [integer, "null"], minimum: -1, maximum: 100000 }
        weekly: { type: [integer, "null"], minimum: -1, maximum: 100000 }
        monthly: { type: [integer, "null"], minimum: -1, maximum: 100000 }
        active: { type: [integer, "null"], minimum: -1, maximum: 100000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    LogReseller:
      type: object
      required: [telegramId, username]
      properties:
        telegramId: { type: integer }
