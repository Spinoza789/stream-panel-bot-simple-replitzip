openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      responses:
        "200":
          description: Browser authentication state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/status:
    get:
      operationId: getPasswordAuthStatus
      responses:
        "200":
          description: Whether the administrator login has been created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAuthStatus" }
  /auth/login:
    post:
      operationId: passwordLogin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLoginInput" }
      responses:
        "200":
          description: Signed in with a rotated secure cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/setup:
    post:
      operationId: setupPasswordOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordSetupInput" }
      responses:
        "200":
          description: One-time owner setup completed and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/logout:
    post:
      operationId: passwordLogout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordLogoutInput" }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUserEnvelope" }
  /auth/account:
    get:
      operationId: getPasswordAccount
      responses:
        "200":
          description: Current administrator login settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
    patch:
      operationId: updatePasswordAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordAccountInput" }
      responses:
        "200":
          description: Account saved, other sessions revoked and current cookie rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
  /admin/access:
    get:
      operationId: getAdminAccess
      responses:
        "200":
          description: Current owner access state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Real order totals and recent orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/orders:
    get:
      operationId: listAdminOrders
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Bounded order page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Safe order details and recovery eligibility
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderDetail" }
  /admin/status:
    get:
      operationId: getAdminStatus
      responses:
        "200":
          description: Configuration readiness, not an upstream health probe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
  /admin/orders/{id}/recovery:
    post:
      operationId: previewTrialRecovery
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryPreviewInput" }
      responses:
        "200":
          description: Preview only; no account queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryDraft" }
  /admin/recovery/confirm:
    post:
      operationId: confirmTrialRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryConfirmation" }
      responses:
        "200":
          description: Original trial queued or preview cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryResult" }
  /auth/totp/setup:
    post:
      operationId: setupTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpSetupInput" }
      responses:
        "200":
          description: Pending authenticator secret for this session only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
  /auth/totp/enable:
    post:
      operationId: enableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCodeInput" }
      responses:
        "200":
          description: Two-factor sign-in enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
  /auth/totp/disable:
    post:
      operationId: disableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisableInput" }
      responses:
        "200":
          description: Two-factor sign-in disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordAccount" }
  /admin/resellers:
    get:
      operationId: listAdminResellers
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Resellers with balances and customer counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerPage" }
  /admin/resellers/{id}:
    get:
      operationId: getAdminReseller
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One reseller with statistics and recent credit history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/resellers/{id}/status:
    post:
      operationId: setAdminResellerStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerStatusInput" }
      responses:
        "200":
          description: Updated reseller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/resellers/{id}/credits:
    post:
      operationId: adjustAdminResellerCredits
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResellerCreditsInput" }
      responses:
        "200":
          description: Updated reseller after a manual credit adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResellerDetail" }
  /admin/reports:
    get:
      operationId: getAdminReports
      parameters:
        - { name: months, in: query, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
      responses:
        "200":
          description: Monthly revenue and credit movements plus per-reseller totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminReports" }
  /admin/tickets:
    get:
      operationId: listAdminTickets
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, answered, closed, all], default: open } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Support tickets with the latest message preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketPage" }
  /admin/tickets/{id}:
    get:
      operationId: getAdminTicket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: One ticket with its full conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/tickets/{id}/reply:
    post:
      operationId: replyAdminTicket
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketReplyInput" }
      responses:
        "200":
          description: Ticket after the answer was stored and sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/tickets/{id}/status:
    post:
      operationId: setAdminTicketStatus
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketStatusInput" }
      responses:
        "200":
          description: Ticket after the status change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTicketDetail" }
  /admin/ratecard:
    get:
      operationId: getAdminRateCard
      responses:
        "200":
          description: Credit packs, subscription costs and trial limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRateCard" }
    post:
      operationId: updateAdminRateCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateCardInput" }
      responses:
        "200":
          description: Rate card after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRateCard" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - { $ref: "#/components/schemas/AuthUser" }
            - { type: "null" }
    PasswordAuthStatus:
      type: object
      required: [configured, setupAvailable]
      properties:
        configured: { type: boolean }
        setupAvailable: { type: boolean }
    PasswordLogoutInput:
      type: object
      additionalProperties: false
      properties: {}
    PasswordLoginInput:
      type: object
      required: [identifier, password]
      additionalProperties: false
      properties:
        identifier: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
        code: { type: string, minLength: 6, maxLength: 8, pattern: "^[0-9]{6,8}$" }
    PasswordSetupInput:
      type: object
      required: [username, email, password, setupCode]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]*$" }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        setupCode: { type: string, minLength: 20, maxLength: 200 }
    PasswordAccount:
      type: object
      required: [username, email, totpEnabled]
      properties:
        username: { type: string }
        email: { type: string, format: email }
        totpEnabled: { type: boolean }
    TotpSetupInput:
      type: object
      additionalProperties: false
      properties: {}
    TotpSetup:
      type: object
      required: [secret, uri, qr]
      properties:
        secret: { type: string }
        uri: { type: string }
        qr: { type: string }
    TotpCodeInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 6, maxLength: 8, pattern: "^[0-9]{6,8}$" }
    TotpDisableInput:
      type: object
      required: [currentPassword, code]
      additionalProperties: false
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        code: { type: string, minLength: 6, maxLength: 8, pattern: "^[0-9]{6,8}$" }
    AdminReseller:
      type: object
      required: [telegramId, username, status, createdAt, balance, reserved, available, customers, activeCustomers, creditsBought, lastActivity]
      properties:
        telegramId: { type: integer }
        username: { type: string }
        status: { type: string }
        createdAt: { type: integer }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        customers: { type: integer }
        activeCustomers: { type: integer }
        creditsBought: { type: integer }
        lastActivity: { type: integer }
    AdminTicket:
      type: object
      required: [id, telegramId, username, topic, topicLabel, status, channel, reseller, createdAt, updatedAt, messages, lastSender, preview]
      properties:
        id: { type: string }
        telegramId: { type: integer }
        username: { type: string }
        topic: { type: string }
        topicLabel: { type: string }
        status: { type: string, enum: [open, answered, closed] }
        channel: { type: string }
        reseller: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        messages: { type: integer }
        lastSender: { type: string }
        preview: { type: string }
    TicketCounts:
      type: object
      required: [open, answered, closed]
      properties:
        open: { type: integer }
        answered: { type: integer }
        closed: { type: integer }
    AdminTicketPage:
      type: object
      required: [items, page, pageSize, more, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminTicket" } }
        page: { type: integer }
        pageSize: { type: integer }
        more: { type: boolean }
        counts: { $ref: "#/components/schemas/TicketCounts" }
    TicketMessage:
      type: object
      required: [id, sender, body, actor, createdAt]
      properties:
        id: { type: string }
        sender: { type: string, enum: [customer, support] }
        body: { type: string }
        actor: { type: string }
        createdAt: { type: integer }
    AdminTicketDetail:
      type: object
      required: [ticket, messages]
      properties:
        ticket: { $ref: "#/components/schemas/AdminTicket" }
        messages: { type: array, items: { $ref: "#/components/schemas/TicketMessage" } }
        delivered: { type: boolean }
    TicketReplyInput:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    TicketStatusInput:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [open, closed] }
    AdminResellerPage:
      type: object
      required: [items, page, pageSize, more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminReseller" } }
        page: { type: integer }
        pageSize: { type: integer }
        more: { type: boolean }
    ResellerStatsWindow:
      type: object
      required: [credits_bought, credits_used, tests_created, subscriptions_created, tests_converted, conversion_rate]
      properties:
        credits_bought: { type: integer }
        credits_used: { type: integer }
        tests_created: { type: integer }
        subscriptions_created: { type: integer }
        tests_converted: { type: integer }
        conversion_rate: { type: integer }
    ResellerStats:
      type: object
      required: [this_month, all_time]
      properties:
        this_month: { $ref: "#/components/schemas/ResellerStatsWindow" }
        all_time: { $ref: "#/components/schemas/ResellerStatsWindow" }
    LedgerEntry:
      type: object
      required: [createdAt, movement, reason, reference]
      properties:
        createdAt: { type: integer }
        movement: { type: integer }
        reason: { type: string }
        reference: { type: string }
    AdminResellerDetail:
      type: object
      required: [reseller, stats, history]
      properties:
        reseller: { $ref: "#/components/schemas/AdminReseller" }
        stats: { $ref: "#/components/schemas/ResellerStats" }
        history: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
    ResellerStatusInput:
      type: object
      required: [status, reason]
      additionalProperties: false
      properties:
        status: { type: string, enum: [active, suspended] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    ResellerCreditsInput:
      type: object
      required: [movement, reason, requestKey]
      additionalProperties: false
      properties:
        movement: { type: integer, minimum: -100000, maximum: 100000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
        requestKey: { type: string, minLength: 8, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
    ReportMonth:
      type: object
      required: [month, retailOrders, retailGbp, creditPacks, creditGbp, totalGbp, creditsSold, creditsUsed, tests, testsConverted]
      properties:
        month: { type: string }
        retailOrders: { type: integer }
        retailGbp: { type: number }
        creditPacks: { type: integer }
        creditGbp: { type: number }
        totalGbp: { type: number }
        creditsSold: { type: integer }
        creditsUsed: { type: integer }
        tests: { type: integer }
        testsConverted: { type: integer }
    AdminReports:
      type: object
      required: [months, resellers]
      properties:
        months: { type: array, items: { $ref: "#/components/schemas/ReportMonth" } }
        resellers: { type: array, items: { $ref: "#/components/schemas/AdminReseller" } }
    RateCardPackage:
      type: object
      required: [id, pricePence, credits, active]
      properties:
        id: { type: string }
        pricePence: { type: integer }
        credits: { type: integer }
        active: { type: boolean }
    RateCardCost:
      type: object
      required: [months, connections, credits]
      properties:
        months: { type: integer }
        connections: { type: integer }
        credits: { type: integer }
    RateCardPlan:
      type: object
      required: [id, name, months, connections, detail, gbpPrice, active]
      properties:
        id: { type: string }
        name: { type: string }
        months: { type: integer }
        connections: { type: integer }
        detail: { type: string }
        gbpPrice: { type: string }
        active: { type: boolean }
    AdminRateCard:
      type: object
      required: [packages, plans, costs, trialDaily, trialActive]
      properties:
        packages: { type: array, items: { $ref: "#/components/schemas/RateCardPackage" } }
        plans: { type: array, items: { $ref: "#/components/schemas/RateCardPlan" } }
        costs: { type: array, items: { $ref: "#/components/schemas/RateCardCost" } }
        trialDaily: { type: integer }
        trialActive: { type: integer }
    RateCardInput:
      type: object
      required: [category, values, reason]
      additionalProperties: false
      properties:
        category: { type: string, enum: [package, package_add, package_delete, plan, cost, trials] }
        values: { type: array, maxItems: 4, items: { oneOf: [{ type: string, maxLength: 40 }, { type: integer }, { type: boolean }] } }
        reason: { type: string, minLength: 3, maxLength: 500 }
    PasswordAccountInput:
      type: object
      required: [username, email, currentPassword]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: "^[A-Za-z0-9_][A-Za-z0-9_.-]*$" }
        email: { type: string, format: email, maxLength: 254 }
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 12, maxLength: 128 }
    AdminAccess:
      type: object
      required: [authenticated, authorized, ownerConfigured, authConfigured, canClaimOwner]
      properties:
        authenticated: { type: boolean }
        authorized: { type: boolean }
        ownerConfigured: { type: boolean }
        authConfigured: { type: boolean }
        canClaimOwner: { type: boolean }
    AdminOrder:
      type: object
      required: [id, kind, status, plan, createdAt, amount, symbol, network, customer]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string }
        plan: { type: string }
        createdAt: { type: integer }
        amount: { type: string }
        symbol: { type: string }
        network: { type: string }
        customer: { type: string }
    AdminOrderPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminOrder" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminOverview:
      type: object
      required: [mode, total, fulfilled, review, trials, queued, pending, recent, creditsSoldMonth, activeResellers, testsConverted, revenueMonthGbp, openTickets]
      properties:
        openTickets: { type: integer }
        creditsSoldMonth: { type: integer }
        activeResellers: { type: integer }
        testsConverted: { type: integer }
        revenueMonthGbp: { type: number }
        mode: { type: string }
        total: { type: integer }
        fulfilled: { type: integer }
        review: { type: integer }
        trials: { type: integer }
        queued: { type: integer }
        pending: { type: integer }
        recent: { type: array, items: { $ref: "#/components/schemas/AdminOrder" } }
    AdminOrderDetail:
      type: object
      required: [order, message, recoveryEligible, recoveryReason]
      properties:
        order: { $ref: "#/components/schemas/AdminOrder" }
        message: { type: string }
        recoveryEligible: { type: boolean }
        recoveryReason: { type: string }
    AdminStatus:
      type: object
      required: [mode, workersActive, panelWrites, telegramEnabled, resellerSchema, notificationSchema, panelConfigured, database]
      properties:
        mode: { type: string }
        workersActive: { type: boolean }
        panelWrites: { type: boolean }
        telegramEnabled: { type: boolean }
        resellerSchema: { type: boolean }
        notificationSchema: { type: boolean }
        panelConfigured: { type: boolean }
        database: { type: string }
    RecoveryPreviewInput:
      type: object
      additionalProperties: false
      properties: {}
    RecoveryDraft:
      type: object
      required: [nonce, orderId, expiresAt, warning]
      properties:
        nonce: { type: string }
        orderId: { type: string }
        expiresAt: { type: integer }
        warning: { type: string }
    RecoveryConfirmation:
      type: object
      additionalProperties: false
      required: [nonce, attestation, cancel]
      properties:
        nonce: { type: string, pattern: "^[a-f0-9]{24}$" }
        attestation: { type: boolean }
        cancel: { type: boolean }
    RecoveryResult:
      type: object
      required: [orderId, queued, message]
      properties:
        orderId: { type: string }
        queued: { type: boolean }
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

